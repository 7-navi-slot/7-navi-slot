.cell.seven{filter:none;-webkit-text-stroke:0}.cell{background:linear-gradient(110deg,#e6dfd1,#fffaf0 25%,#f9f0de 75%,#ddd2be);border-bottom:1px solid #d1c4b0}.cell:nth-child(2){background:linear-gradient(90deg,#ffedbf,#fff9e7,#ffedbf)}

/* V7 symbol treatments */
.bell-mark,.watermelon-mark,.cherry-mark{font-size:.85em;text-shadow:none}
.replay-mark{font-size:.31em;letter-spacing:-.04em;color:#eefaff;background:linear-gradient(135deg,#2d79b5,#173b80);border:2px solid #89d7ff;border-radius:30px;padding:.3em .35em;text-shadow:0 1px #10315a;font-weight:1000}

function cell(s){return `<div class="cell symbol-cell ${s==='7'?'seven':''}"><img src="${symbolImages[s]}" alt="${s}" draggable="false"></div>`;}

function showReel(i,mid){
 const strip=strips[i],n=strip.length;
 reels[i].innerHTML=[strip[(mid+n-1)%n],strip[mid%n],strip[(mid+1)%n]].map(cell).join('');
}
// On a loss, the third stopped reel has seven in its bottom row.
// Both previously stopped reels have seven on the center payline.
function drawReel(i,sevenOnCenter){
 const n=strips[i].length;
 const mid=(sevenAt[i]+(sevenOnCenter?0:n-1))%n;
 showReel(i,mid);
}
function nav(arr){$('nav').innerHTML=arr.map(v=>`<div class="digit ${v==='?'?'question':''}">${v}</div>`).join('')};function refresh(){ $('choice').textContent=modes[mode];$('selector').hidden=phase!=='select';$('push').hidden=phase!=='select';$('nav').hidden=phase==='select'||phase==='result';$('result').hidden=phase!=='result';$('counter').textContent='GAME '+String(game).padStart(4,'0');$('stats').textContent=`WIN ${wins} / ${played}`;stops.forEach((b,i)=>b.disabled=phase!=='spin'||order.includes(i));$('lever').disabled=phase==='select'||phase==='spin';$('lever').style.opacity=phase==='spin'?.5:1}function stopFrames(){frames.forEach(x=>clearInterval(x));frames=[];reels.forEach(r=>r.classList.remove('spinning'))}function select(){stopFrames();phase='select';$('screen').className='screen';reels.forEach((r,i)=>drawReel(i,true));refresh()}function start(){if(phase!=='ready'&&phase!=='result')return;stopFrames();game++;phase='spin';order=[];chosen=rand(2);let perms=[[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]];correct=mode===0?perms[rand(6)]:mode===1?(chosen===0?[1,0,2]:[1,2,0]):perms[rand(6)];if(mode===0){let a=[0,0,0];correct.forEach((v,j)=>a[v]=j+1);nav(a)}else if(mode===1)nav(['?','1','?']);else nav(['?','?','?']);$('screen').className='screen';$('result').hidden=true;reels.forEach((r,i)=>{r.classList.add('spinning');frames[i]=setInterval(()=>showReel(i,rand(strips[i].length)),65+15*i)});$('lever').classList.add('down');setTimeout(()=>$('lever').classList.remove('down'),180);refresh()}function stop(i){if(phase!=='spin'||order.includes(i))return;order.push(i);clearInterval(frames[i]);reels[i].classList.remove('spinning');let last=order.length===3;let success=mode===0?order.every((x,j)=>x===correct[j]):mode===1?order[0]===1&&order[1]===correct[1]:order.every((x,j)=>x===correct[j]);drawReel(i,!last||success);if(last){phase='result';played++;if(success)wins++;$('screen').className='screen '+(success?'win':'lose');$('result').textContent=success?'Congratulations':'You Lose';$('result').hidden=false;refresh()}}$('prev').onclick=()=>{mode=(mode+2)%3;refresh()};$('next').onclick=()=>{mode=(mode+1)%3;refresh()};$('push').onclick=()=>{phase='ready';$('selector').hidden=true;$('push').hidden=true;$('nav').innerHTML='<div class="ready-message">7が揃えば...!?</div>';$('nav').hidden=false;refresh()};$('lever').onclick=start;stops.forEach(b=>b.onclick=()=>stop(Number(b.dataset.i)));$('back').onclick=select;document.addEventListener('keydown',e=>{if(phase==='select'){if(e.key==='ArrowLeft')$('prev').click();if(e.key==='ArrowRight')$('next').click();if(e.key==='Enter')$('push').click()}else if(e.key===' '){e.preventDefault();start()}else if(['1','2','3'].includes(e.key))stop(Number(e.key)-1)});select();
</script></body></html>
